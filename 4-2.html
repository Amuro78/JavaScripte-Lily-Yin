<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Searching results</title>
</head>
<body>
<form id="search-form">
  <input id="query" name="q" type="text" placeholder="Enter TV series keywords">
  <input type="submit" value="Search">
</form>

<script>
    'use strict';

    const searchForm = document.getElementById('search-form');

    searchForm.addEventListener('submit', async function(evt){
        evt.preventDefault();
        const value_from_input = document.getElementById('query').value;

        console.log(`Searching for: "${value_from_input}"`);

        try{
            const response = await fetch(`https://api.tvmaze.com/search/shows?q=${value_from_input}`);
            const jsonData = await response.json();

            console.log('Search results:');
            console.log(jsonData);

        } catch(error){
            console.error('Search failed:', error.message);
        }
    })

</script>

</body>
</html>
