<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Searching results</title>
</head>
<body>
<form id="search-form">
  <input id="query" name="q" type="text" placeholder="Enter drama name">
  <input type="submit" value="Search">
</form>
<script>
    'use strict';

    const searchForm = document.getElementById(`search-form`)
    searchForm.addEventListener(`submit`,async function(evt){
        evt.preventDefault();
        const name = document.getElementById('query').value;
        try{
            const response = await fetch(`https://api.tvmaze.com/search/shows?q=${name}`);
            const jsonData = await response.json();
            console.log(jsonData);
        }catch(error){
            console.log(error.message);
        }
    })

</script>

</body>
</html>
