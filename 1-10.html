<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<p id="target1"></p>
<script>
    let quantity, target_sum, success_count,  total_count
    quantity = parseInt(prompt("Please enter the quantity of dice:"));
    target_sum = parseInt(prompt("Please enter the target sum of dice:"));
    success_count = 0
    total_count= 10000



    for (let i =0; i< total_count; i++) {
        let current_sum = 0

        for (let j = 0; j < quantity; j++) {
            let dice = Math.floor(Math.random() * 6) + 1
            current_sum += dice
        }


        if (current_sum === target_sum) {
            success_count++;
        }
    }

    let probability,percentage
    probability = success_count / total_count
    percentage = (probability*100).toFixed(2)
    document.getElementById("target1").innerHTML = quantity + " dice, sum " + target_sum + ", probability is about " + percentage
</script>

</body>
</html>
