<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<p id="target1"></p>
<script>
    let name = prompt('Type your name:');
    const randomNum = Math.floor(Math.random() * 4) + 1;

let house;
switch (randomNum) {
    case 1:
        house = "Gryffindor";
        break;
    case 2:
        house = "Slytherin";
        break;
    case 3:
        house = "Hufflepuff";
        break;
    case 4:
        house = "Ravenclaw";
        break;
}
document.querySelector('#target1').innerHTML =  name +"," + " you are " + house + "!";
</script>

</body>
</html>
