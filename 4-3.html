<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chucknorris - TV Series Search</title>
</head>
<body>
<form id="SearchForm">
    <input type="text" id="query" placeholder="Enter TV series keywords">
    <input type="submit" value="Search">
</form>

<div id="results"></div>

<script>
    const form = document.getElementById('SearchForm');
    const results = document.getElementById('results');

    form.addEventListener('submit', async function(event) {
        event.preventDefault();

        const queryInput = document.getElementById('query');
        const searchTerm = queryInput.value.trim();

        try {
            const apiUrl = `https://api.tvmaze.com/search/shows?q=${searchTerm}`;
            const response = await fetch(apiUrl);
            const data = await response.json();

            if (!data || data.length === 0) {
                results.innerHTML = `<p> No TV series found for "${searchTerm}". </p>`;
                return;
            }

            results.innerHTML = '';

            for (let i = 0; i < data.length; i++) {
                const tvShow = data[i];
                const show = tvShow.show;

                const article = document.createElement('article');

                const nameElement = document.createElement('h2');
                nameElement.textContent = show.name;
                article.appendChild(nameElement);

                const linkElement = document.createElement('a');
                linkElement.href = show.url;
                linkElement.textContent = show.url;
                linkElement.target = '_blank';
                article.appendChild(linkElement);

                const imageUrl = show.image?.medium;
                if (imageUrl) {
                    const imgElement = document.createElement('img');
                    imgElement.src = imageUrl;
                    imgElement.alt = show.name;
                    article.appendChild(imgElement);
                }

                results.appendChild(article);
            }

        } catch (error) {
            console.error('Error:', error);
        }
    });
</script>

</body>
</html>
